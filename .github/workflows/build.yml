name: Build DSi-FC-Men CIA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: devkitpro/devkitarm
    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        apt-get update -qq || true
        apt-get install -y -qq git cmake make g++ zip unzip wget curl || true

    - name: BannerTool
      run: |
        git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git
        cd 3ds-bannertool && cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(nproc) && cmake --install build || true

    - name: Makerom
      run: |
        git clone --depth 1 --recursive https://github.com/3DSGuy/Project_CTR.git
        cd Project_CTR/makerom && make deps && make -j$(nproc)
        cp -f bin/makerom /usr/local/bin/makerom && chmod +x /usr/local/bin/makerom || true

    - name: Build 3DSX + CIA
      run: |
        make clean || true
        make all || echo "3dsx status $?"
        make cia || echo "cia status $?"
        ls -la DSi-FC-Men.* 2>/dev/null || ls -la

    - name: Package release
      run: |
        mkdir -p release
        cp -v DSi-FC-Men.cia DSi-FC-Men.3dsx release/ 2>/dev/null || true
        cp -v assets/icon.png assets/banner.png release/ 2>/dev/null || true
        mkdir -p setup/sd_files/_nds/DSi-FC-Men/sounds
        cp -v assets/sounds/*.wav setup/sd_files/_nds/DSi-FC-Men/sounds/ 2>/dev/null || true
        (cd setup/sd_files && zip -r ../../release/DSi-FC-Men-SD-Setup.zip .)
        ls -la release/

    - uses: actions/upload-artifact@v4
      with:
        name: DSi-FC-Men
        path: release/
        if-no-files-found: warn

    - name: Nightly Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Nightly – DSi-FC-Men"
        prerelease: true
        body: |
          **One CIA – does everything**

          1. Install `DSi-FC-Men.cia` with FBI
          2. Launch once → folders + config are created automatically
          3. Put ROMs in `/roms/nds/`
          4. Put nds-bootstrap in `/_nds/nds-bootstrap/`
          5. Optional: extract SD-Setup zip for sounds/templates

          SELECT = BGM on/off · START = exit
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
