name: Build Nintendo 3DS CIA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: devkitpro/devkitarm
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update -qq || true
        apt-get install -y -qq git cmake make g++ zip unzip wget curl p7zip-full || true

    - name: Build BannerTool
      run: |
        git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git || true
        if [ -d 3ds-bannertool ]; then
          cd 3ds-bannertool
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc) || true
          cmake --install build || true
        fi

    - name: Build Makerom
      run: |
        git clone --depth 1 --recursive https://github.com/3DSGuy/Project_CTR.git || true
        if [ -d Project_CTR/makerom ]; then
          cd Project_CTR/makerom
          make deps || true
          make -j$(nproc) || true
          cp -f ./bin/makerom /usr/local/bin/makerom 2>/dev/null || true
          chmod +x /usr/local/bin/makerom 2>/dev/null || true
        fi

    - name: Build Setupper
      working-directory: setupper
      run: |
        make clean || true
        make all || echo "Setupper make status $?"
        ls -la *.3dsx *.elf *.smdh 2>/dev/null || ls -la

    - name: Build Main Menu
      working-directory: source
      run: |
        make clean || true
        make all || echo "Main menu make status $?"
        ls -la *.3dsx *.elf *.smdh 2>/dev/null || ls -la

    - name: Package SD Setup with sounds
      run: |
        mkdir -p release
        mkdir -p setup/sd_files/_nds/DSi-FC-Men/sounds
        if [ -d assets/sounds ]; then
          cp -v assets/sounds/*.wav setup/sd_files/_nds/DSi-FC-Men/sounds/ 2>/dev/null || true
          cp -v assets/sounds/CREDITS.txt setup/sd_files/_nds/DSi-FC-Men/sounds/ 2>/dev/null || true
        fi
        cp -v setupper/*.3dsx release/ 2>/dev/null || true
        cp -v setupper/*.cia release/ 2>/dev/null || true
        cp -v source/*.3dsx release/ 2>/dev/null || true
        cd setup/sd_files && zip -r ../../release/DSi-FC-Men-SD-Setup.zip . && cd ../..
        if ls setup/sd_files/_nds/DSi-FC-Men/sounds/*.wav 1>/dev/null 2>&1; then
          (cd setup/sd_files/_nds/DSi-FC-Men/sounds && zip -r ../../../../release/DSi-FC-Men-Sounds.zip ./*.wav ./CREDITS.txt) || true
        fi
        ls -la release/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DSi-FC-Men
        path: release/
        if-no-files-found: warn

    - name: Nightly Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Nightly – DSi-FC-Men"
        prerelease: true
        body: |
          **DSi-FC-Men Nightly**
          - `DSi-FC-Men-SD-Setup.zip` – microSD structure + modern sounds
          - `DSi-FC-Men-Sounds.zip` – sounds only
          - Setupper / menu binaries when build succeeds

          1. Extract SD-Setup zip to microSD root
          2. ROMs → `/roms/nds/`
          3. nds-bootstrap → `/_nds/nds-bootstrap/`
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
