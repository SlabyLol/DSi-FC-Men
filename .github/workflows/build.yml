name: Build DSi-FC-Men CIA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: devkitpro/devkitarm
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 3DS SDK
        run: |
          set -ex
          export DEVKITPRO=/opt/devkitpro
          if command -v dkp-pacman >/dev/null 2>&1; then
            dkp-pacman -Sy --noconfirm
            dkp-pacman -S --noconfirm 3ds-dev 3ds-libctru 3ds-citro3d 3ds-citro2d 3ds-zlib general-tools 3ds-tools || true
          fi
          ls -la /opt/devkitpro/libctru/include/3ds.h
          which smdhtool || true

      - name: Install host tools
        run: |
          apt-get update -qq || true
          apt-get install -y -qq git cmake make g++ zip unzip wget curl python3 || true
          mkdir -p assets source romfs/sounds setup/sd_files tools

      - name: Ensure assets
        run: |
          python3 tools/gen_assets.py || python3 -c "print('gen_assets missing, skip')"
          ls -la assets/ || true

      - name: Build BannerTool
        run: |
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git
          cd 3ds-bannertool
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          cmake --install build 2>/dev/null || cp build/bannertool /usr/local/bin/ || true

      - name: Build Makerom
        run: |
          git clone --depth 1 --recursive https://github.com/3DSGuy/Project_CTR.git
          cd Project_CTR/makerom
          make deps || true
          make -j$(nproc)
          cp -f bin/makerom /usr/local/bin/makerom
          chmod +x /usr/local/bin/makerom

      - name: Build 3DSX
        run: |
          set -ex
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:/usr/local/bin:$PATH"
          if [ -f /etc/profile.d/devkit-env.sh ]; then
            . /etc/profile.d/devkit-env.sh || true
          fi
          make clean || true
          make -j$(nproc) all
          ls -la DSi-FC-Men.* || true

      - name: Build CIA
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:/usr/local/bin:$PATH"
          make cia || true
          ls -la DSi-FC-Men.cia 2>/dev/null || true

      - name: Package release
        run: |
          mkdir -p release
          cp -v DSi-FC-Men.cia DSi-FC-Men.3dsx release/ 2>/dev/null || true
          cp -v assets/icon.png assets/banner.png release/ 2>/dev/null || true
          mkdir -p setup/sd_files/_nds/DSi-FC-Men/sounds
          (cd setup/sd_files && zip -r ../../release/DSi-FC-Men-SD-Setup.zip .) || true
          ls -la release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DSi-FC-Men
          path: release/
          if-no-files-found: warn

      - name: Nightly Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly - DSi-FC-Men
          prerelease: true
          body: One CIA - install with FBI - FlashCard / Device SD setup
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
