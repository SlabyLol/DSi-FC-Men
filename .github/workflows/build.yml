name: Build DSi-FC-Men CIA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: devkitpro/devkitarm
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/portlibs/3ds/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup devkitPro 3DS packages
      run: |
        set -e
        echo "DEVKITPRO=$DEVKITPRO"
        ls -la /opt/devkitpro/ || true
        if [ ! -f /opt/devkitpro/3ds_rules ]; then
          echo "Installing 3ds-dev..."
          dkp-pacman -Sy --noconfirm 3ds-dev 3ds-libctru 3ds-citro3d 3ds-citro2d 3ds-zlib general-tools 3ds-tools || \
          pacman -Sy --noconfirm 3ds-dev 3ds-libctru 3ds-citro3d 3ds-citro2d || true
        fi
        ls -la /opt/devkitpro/3ds_rules || ls -la /opt/devkitpro/devkitARM/ || true
        which arm-none-eabi-gcc || true
        which 3dsxtool || true

    - name: Install host tools
      run: |
        apt-get update -qq || true
        apt-get install -y -qq git cmake make g++ zip unzip wget curl pkg-config || true

    - name: Build BannerTool
      run: |
        git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git
        cd 3ds-bannertool
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(nproc)
        cmake --install build || cp -v build/bannertool /usr/local/bin/ || true
        bannertool -h || true

    - name: Build Makerom
      run: |
        git clone --depth 1 --recursive https://github.com/3DSGuy/Project_CTR.git
        cd Project_CTR/makerom
        make deps || true
        make -j$(nproc)
        cp -f bin/makerom /usr/local/bin/makerom
        chmod +x /usr/local/bin/makerom
        makerom -h || true

    - name: Build 3DSX
      run: |
        export DEVKITPRO=/opt/devkitpro
        export DEVKITARM=/opt/devkitpro/devkitARM
        export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
        [ -f /etc/profile.d/devkit-env.sh ] && . /etc/profile.d/devkit-env.sh || true
        [ -f $DEVKITPRO/devkitarm.sh ] && . $DEVKITPRO/devkitarm.sh || true
        echo "Using DEVKITPRO=$DEVKITPRO"
        ls "$DEVKITPRO/3ds_rules" || ls "$DEVKITPRO/devkitARM/" || true
        make clean || true
        make -j$(nproc) all
        ls -la DSi-FC-Men.3dsx DSi-FC-Men.elf DSi-FC-Men.smdh 2>/dev/null || ls -la

    - name: Build CIA
      run: |
        export DEVKITPRO=/opt/devkitpro
        export DEVKITARM=/opt/devkitpro/devkitARM
        export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:/usr/local/bin:$PATH"
        make cia || echo "CIA step status $?"
        ls -la DSi-FC-Men.cia 2>/dev/null || true

    - name: Package release
      run: |
        mkdir -p release
        cp -v DSi-FC-Men.cia DSi-FC-Men.3dsx release/ 2>/dev/null || true
        cp -v assets/icon.png assets/banner.png release/ 2>/dev/null || true
        mkdir -p setup/sd_files/_nds/DSi-FC-Men/sounds
        cp -v assets/sounds/*.wav setup/sd_files/_nds/DSi-FC-Men/sounds/ 2>/dev/null || true
        (cd setup/sd_files && zip -r ../../release/DSi-FC-Men-SD-Setup.zip .)
        ls -la release/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DSi-FC-Men
        path: release/
        if-no-files-found: warn

    - name: Nightly Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Nightly – DSi-FC-Men"
        prerelease: true
        body: |
          **One CIA – auto setup**

          1. Install `DSi-FC-Men.cia` with FBI
          2. Launch → choose FlashCard / Device SD
          3. ROMs → `/roms/nds/`
          4. nds-bootstrap → `/_nds/nds-bootstrap/`

          Controls: Circle Pad + D-Pad + Touch + L/R · SELECT = BGM · START = Exit
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
