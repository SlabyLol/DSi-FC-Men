# ============================================================
# DSi-FC-Men – Main Configuration
# ============================================================

[General]
Language = English
Theme = Default
ShowSplash = true
SplashDuration = 2
SoftReset = true
AutobootDelay = 0
ShowHiddenFiles = false

[Launcher]
# Always use nds-bootstrap for .nds ROMs
DefaultLauncher = nds-bootstrap
ShowBoxart = true
ShowFileExtensions = false
SortBy = name
FoldersFirst = true

[Interface]
BackgroundColor = 0x0A0A12
TextColor = 0xFFFFFF
HighlightColor = 0x00B4FF
SecondaryColor = 0x1A1A2E
FontSize = 12
ShowBattery = true
ShowClock = true

[Paths]
RomsPath = /roms/nds
SavesPath = /saves
BoxartPath = /_nds/DSi-FC-Men/boxart
ThemesPath = /_nds/DSi-FC-Men/themes
SoundsPath = /_nds/DSi-FC-Men/sounds
BootstrapPath = /_nds/nds-bootstrap

[Advanced]
EnableLogging = false
FastBoot = false
UseDSiMode = true
EnableSounds = true
