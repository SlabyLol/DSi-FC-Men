; nds-bootstrap configuration for DSi-FC-Men
; Docs: https://github.com/DS-Homebrew/nds-bootstrap

[NDS-BOOTSTRAP]
; Cache block size (0 = 16KB, 1 = 32KB)
CACHE_BLOCK_SIZE = 0

; Debug (shows loading screen info)
DEBUG = 0

; Logging
LOGGING = 0

; Sound frequency: 0 = 32.73 kHz, 1 = 48 kHz
SOUND_FREQ = 1

; Loading screen: 0 = None, 1 = Regular, 2 = Soft
LOADING_SCREEN = 1

; Language (-1 = game default)
LANGUAGE = -1

; Region (-1 = game default)
REGION = -1
