# ============================================================
# DSi-FC-Men – Main Configuration
# Edit this file on your microSD to change everything
# No recompilation needed
# ============================================================

[General]
Language = English
Theme = Default
ShowSplash = true
SplashDuration = 2
SoftReset = true
AutobootDelay = 0
ShowHiddenFiles = false

[Launcher]
# Options: nds-bootstrap / kernel
DefaultLauncher = nds-bootstrap
ShowBoxart = true
ShowFileExtensions = false
SortBy = name
FoldersFirst = true

[Interface]
BackgroundColor = 0x0A0A12
TextColor = 0xFFFFFF
HighlightColor = 0x00B4FF
SecondaryColor = 0x1A1A2E
FontSize = 12
ShowBattery = true
ShowClock = true

[Paths]
RomsPath = /roms/nds
SavesPath = /saves
BoxartPath = /_nds/DSi-FC-Men/boxart
ThemesPath = /_nds/DSi-FC-Men/themes
SoundsPath = /_nds/DSi-FC-Men/sounds

[Advanced]
EnableLogging = false
FastBoot = false
UseDSiMode = true
EnableSounds = true
